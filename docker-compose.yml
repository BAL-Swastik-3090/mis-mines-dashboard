version: '3.9'

services:

  # ── REVERSE PROXY ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mines_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mines_network
    restart: unless-stopped

  # ── FRONTEND (Next.js · port 3333) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mines_frontend
    environment:
      - PORT=3333
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
    expose:
      - "3333"
    depends_on:
      - backend
    networks:
      - mines_network
    restart: unless-stopped

  # ── BACKEND (FastAPI · port 8989) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mines_backend
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8989"
    depends_on:
      - redis
    networks:
      - mines_network
    restart: unless-stopped

  # ── CACHE (Redis) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mines_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - mines_network
    restart: unless-stopped

  # ── ML SERVICE (uncomment in Phase 4) ────────────────────────────
  # ml_service:
  #   build:
  #     context: ./ml
  #     dockerfile: Dockerfile
  #   container_name: mines_ml
  #   env_file:
  #     - .env
  #   networks:
  #     - mines_network
  #   restart: unless-stopped

  # ── CHATBOT SERVICE (uncomment in Phase 5) ───────────────────────
  # chatbot:
  #   build:
  #     context: ./chatbot
  #     dockerfile: Dockerfile
  #   container_name: mines_chatbot
  #   env_file:
  #     - .env
  #   networks:
  #     - mines_network
  #   restart: unless-stopped

networks:
  mines_network:
    driver: bridge

volumes:
  redis_data:
